<!DOCTYPE html>
<html>
<head>
  <title>Riaar Pharmacy Group Staff Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{
      margin:0;
      padding:20px;
      background:#0f172a;
      color:white;
      font-family:Arial;
    }

    .box{
      max-width:900px;
      margin:auto;
      background:#1e293b;
      padding:24px;
      border-radius:18px;
      margin-bottom:20px;
    }

    h1,h2{
      color:#4ade80;
      margin-top:0;
    }

    label{
      display:block;
      margin-top:14px;
      margin-bottom:6px;
      color:#cbd5e1;
    }

    select,input,button{
      width:100%;
      padding:13px;
      border:none;
      border-radius:10px;
      font-size:15px;
      box-sizing:border-box;
    }

    select,input{
      background:#334155;
      color:white;
    }

    button{
      background:#22c55e;
      color:black;
      font-weight:bold;
      cursor:pointer;
      margin-top:14px;
    }

    .out{
      background:#ef4444;
      color:white;
    }

    .ghost{
      background:#334155;
      color:white;
    }

    .status{
      margin-top:18px;
      background:#0f172a;
      color:#cbd5e1;
      padding:14px;
      border-radius:10px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:15px;
      font-size:14px;
    }

    th,td{
      border-bottom:1px solid #334155;
      padding:10px;
      text-align:left;
    }

    th{
      color:#94a3b8;
    }

    .hidden{
      display:none;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    @media(max-width:700px){
      .row{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Riaar Pharmacy Group</h1>

  <p>Staff Hub</p>

  <label>Staff Member</label>

  <select id="staffSelect"></select>

  <label>PIN</label>

  <input
    id="pinInput"
    type="password"
    placeholder="Enter PIN"
  >

  <label>Reason (optional)</label>

  <input
    id="reasonInput"
    placeholder="Late arrival / early leave reason"
  >

  <div class="row">
    <button onclick="clockIn()">Clock In</button>
    <button class="out" onclick="clockOut()">Clock Out</button>
  </div>

  <div class="status" id="status">
    Ready
  </div>

</div>

<div class="box">

  <h2>Manager Dashboard</h2>

  <div id="managerLogin">

    <label>Manager PIN</label>

    <input
      id="managerPin"
      type="password"
      placeholder="Enter manager PIN"
    >

    <button onclick="managerLogin()">
      Open Dashboard
    </button>

  </div>

  <div id="managerPanel" class="hidden">

    <div class="row">
      <button class="ghost" onclick="loadAttendance()">
        Refresh Records
      </button>

      <button onclick="exportCSV()">
        Export CSV
      </button>
    </div>

    <div class="status" id="managerStatus">
      Dashboard ready
    </div>

    <h3>Change Staff PIN</h3>

    <label>Staff Member</label>

    <select id="pinStaff"></select>

    <label>New 4 Digit PIN</label>

    <input
      id="newPin"
      maxlength="4"
      placeholder="e.g. 4821"
    >

    <button onclick="changePin()">
      Update PIN
    </button>

    <table>

      <thead>
        <tr>
          <th>Time</th>
          <th>Staff</th>
          <th>Type</th>
          <th>Reason</th>
          <th>Branch</th>
        </tr>
      </thead>

      <tbody id="attendanceBody"></tbody>

    </table>

  </div>

</div>

<script>

const SUPABASE_URL =
"https://mpwnqvktljeqetfrlcgy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_qhK08NotN0dxj13ymiOgWw_tEbopdwx";

const MANAGER_PIN = "1234";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let staff = [];
let attendanceRows = [];

async function loadStaff(){

  const { data, error } = await db
    .from("staff")
    .select("*")
    .order("name");

  if(error){

    document.getElementById("status").innerText =
      error.message;

    return;
  }

  staff = data || [];

  const select =
    document.getElementById("staffSelect");

  const pinSelect =
    document.getElementById("pinStaff");

  select.innerHTML = "";
  pinSelect.innerHTML = "";

  staff.forEach(s => {

    const opt =
      document.createElement("option");

    opt.value = s.id;

    opt.textContent =
      s.name + " - " + s.role;

    select.appendChild(opt);

    const opt2 =
      document.createElement("option");

    opt2.value = s.id;

    opt2.textContent =
      s.name;

    pinSelect.appendChild(opt2);

  });

}

function selectedStaff(){

  const id =
    document.getElementById("staffSelect").value;

  return staff.find(
    s => String(s.id) === String(id)
  );

}

function validatePin(){

  const s = selectedStaff();

  const pin =
    document.getElementById("pinInput").value;

  if(!s){
    alert("Select staff member");
    return null;
  }

  if(pin !== s.pin){
    alert("Incorrect PIN");
    return null;
  }

  return s;

}

async function clockIn(){

  const s = validatePin();

  if(!s) return;

  const reason =
    document.getElementById("reasonInput").value;

  const { error } = await db
    .from("attendance")
    .insert({
      staff_id:s.id,
      type:"clock_in",
      reason:reason,
      branch:s.branch
    });

  if(error){
    alert(error.message);
    return;
  }

  document.getElementById("status").innerText =
    s.name + " clocked in";

}

async function clockOut(){

  const s = validatePin();

  if(!s) return;

  const reason =
    document.getElementById("reasonInput").value;

  const { error } = await db
    .from("attendance")
    .insert({
      staff_id:s.id,
      type:"clock_out",
      reason:reason,
      branch:s.branch
    });

  if(error){
    alert(error.message);
    return;
  }

  document.getElementById("status").innerText =
    s.name + " clocked out";

}

function managerLogin(){

  const pin =
    document.getElementById("managerPin").value;

  if(pin !== MANAGER_PIN){

    alert("Incorrect manager PIN");

    return;
  }

  document.getElementById("managerLogin")
    .classList.add("hidden");

  document.getElementById("managerPanel")
    .classList.remove("hidden");

  loadAttendance();

}

async function loadAttendance(){

  const { data, error } = await db
    .from("attendance")
    .select("*, staff(name)")
    .order("clock_time",{ascending:false})
    .limit(100);

  if(error){

    document.getElementById("managerStatus")
      .innerText = error.message;

    return;
  }

  attendanceRows = data || [];

  const body =
    document.getElementById("attendanceBody");

  body.innerHTML = "";

  attendanceRows.forEach(r => {

    const tr =
      document.createElement("tr");

    tr.innerHTML = `
      <td>${new Date(r.clock_time).toLocaleString("en-GB")}</td>
      <td>${r.staff?.name || ""}</td>
      <td>${r.type}</td>
      <td>${r.reason || ""}</td>
      <td>${r.branch || ""}</td>
    `;

    body.appendChild(tr);

  });

}

async function changePin(){

  const id =
    document.getElementById("pinStaff").value;

  const newPin =
    document.getElementById("newPin").value;

  if(newPin.length !== 4){

    alert("PIN must be 4 digits");

    return;
  }

  const { error } = await db
    .from("staff")
    .update({ pin:newPin })
    .eq("id",id);

  if(error){

    alert(error.message);

    return;
  }

  alert("PIN updated successfully");

  document.getElementById("newPin").value = "";

  loadStaff();

}

function exportCSV(){

  const headers =
    ["Time","Staff","Type","Reason","Branch"];

  const rows =
    attendanceRows.map(r => [

      new Date(r.clock_time)
        .toLocaleString("en-GB"),

      r.staff?.name || "",

      r.type,

      r.reason || "",

      r.branch || ""

    ]);

  const csv =
    [headers,...rows]
      .map(r =>
        r.map(x =>
          `"${String(x).replace(/"/g,'""')}"`
        ).join(",")
      ).join("\n");

  const blob =
    new Blob([csv],{type:"text/csv"});

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "riaar_attendance.csv";

  a.click();

}

loadStaff();

</script>

</body>
</html>
