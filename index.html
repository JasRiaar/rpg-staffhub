<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riaar Pharmacy Group Staff Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#071225;--card:#0d1b33;--card2:#132442;--border:#2c4166;--text:#fff;--muted:#9ba9c4;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--amber:#f59e0b}
body{font-family:Outfit,sans-serif;background:linear-gradient(180deg,#071225,#08101f);color:var(--text);min-height:100vh;padding:24px}
.container{max-width:1200px;margin:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.logo{height:70px}
.manager-btn,.logout{background:#132442;border:1px solid #27426d;color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;cursor:pointer}
.card{background:var(--card);border:1px solid var(--border);border-radius:28px;padding:36px;margin-bottom:28px}
.eye{color:#4ade80;font-size:14px;letter-spacing:2px;font-weight:800;margin-bottom:12px}
h1{font-size:62px;margin-bottom:24px} h2{font-size:32px;margin-bottom:20px} h3{margin-bottom:16px}
.clockbox{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;margin-bottom:22px}
.time{font-size:54px;font-weight:800}.date{color:var(--muted);font-size:20px}
.birthday{background:#132442;border:1px solid #27426d;border-radius:18px;padding:18px;font-size:18px;color:#fcd34d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.field{margin-bottom:22px}.field label{display:block;margin-bottom:10px;font-size:14px;font-weight:800;color:#b6c2d9;letter-spacing:1px}
input,select,textarea{width:100%;padding:22px;border-radius:18px;border:1px solid #32486d;background:#15233f;color:#fff;font-size:20px;font-family:Outfit}
textarea{resize:none;height:90px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}
.btn{border:none;border-radius:22px;padding:28px;font-size:32px;font-weight:800;cursor:pointer}
.green{background:linear-gradient(90deg,#22c55e,#16a34a);color:#000}.red{background:linear-gradient(90deg,#ef4444,#dc2626);color:#fff}
.status{margin-top:26px;background:#15233f;border:1px solid #32486d;border-radius:18px;padding:22px;font-size:19px;color:#d5dfef}
.hidden{display:none!important}.manager-panel{margin-top:36px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:320px;margin:auto}
.key{background:#1a2c4d;border:1px solid #38527e;border-radius:16px;padding:20px;text-align:center;font-size:28px;cursor:pointer}
.dots{display:flex;justify-content:center;gap:12px;margin:20px 0}.dot{width:18px;height:18px;border-radius:50%;border:2px solid #38527e}.dot.fill{background:#4ade80}
table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:14px;border-bottom:1px solid #243655;text-align:left;vertical-align:middle}th{color:#a8b6cf}
.note-btn,.small-btn{background:#2563eb;border:none;color:#fff;padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:700}
.pin-change{margin-top:32px;background:#12203a;border:1px solid #2d456a;border-radius:20px;padding:24px}
.pin-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:12px;align-items:end}
.save-pin{background:#22c55e;border:none;color:#000;font-weight:800;border-radius:14px;padding:18px 24px;cursor:pointer}
@media(max-width:900px){h1{font-size:42px}.grid,.btns,.clockbox,.pin-grid{grid-template-columns:1fr}.btn{font-size:26px}.logo{height:54px}}
</style>
</head>

<body>
<div class="container">

<div class="topbar">
<img src="logo.png" class="logo">
<button class="manager-btn" onclick="openManager()">🔒 Manager</button>
</div>

<div class="card">
<div class="clockbox">
  <div>
    <div class="time" id="timeNow">--:--</div>
    <div class="date" id="dateNow">--</div>
  </div>
  <div class="birthday" id="birthdayBox">🎂 Checking staff birthdays...</div>
</div>

<div class="eye">STAFF CLOCK-IN / CLOCK-OUT</div>
<h1>Who are you?</h1>

<div class="grid">
  <div class="field">
    <label>STAFF MEMBER</label>
    <select id="staffSelect"></select>
  </div>
  <div class="field">
    <label>PIN</label>
    <input type="password" id="pinInput" placeholder="Enter your PIN">
  </div>
</div>

<div class="field">
  <label>REASON / NOTE OPTIONAL</label>
  <textarea id="reasonInput" placeholder="Late arrival / early finish reason"></textarea>
</div>

<div class="btns">
  <button class="btn green" onclick="clockIn()">▶ Clock In</button>
  <button class="btn red" onclick="clockOut()">■ Clock Out</button>
</div>

<div class="status" id="status">Ready — select your name and enter your PIN</div>
</div>

<div id="managerArea" class="hidden manager-panel">
<div class="card">

<div id="managerLogin">
<h2>Manager Access</h2>
<div class="dots"><div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div></div>
<div class="keypad">
<div class="key" onclick="pressPin('1')">1</div><div class="key" onclick="pressPin('2')">2</div><div class="key" onclick="pressPin('3')">3</div>
<div class="key" onclick="pressPin('4')">4</div><div class="key" onclick="pressPin('5')">5</div><div class="key" onclick="pressPin('6')">6</div>
<div class="key" onclick="pressPin('7')">7</div><div class="key" onclick="pressPin('8')">8</div><div class="key" onclick="pressPin('9')">9</div>
<div class="key" onclick="pressPin('del')">⌫</div><div class="key" onclick="pressPin('0')">0</div><div class="key" onclick="pressPin('ok')">OK</div>
</div>
</div>

<div id="dashboard" class="hidden">
<h2>Attendance Dashboard</h2>
<button class="logout" onclick="logoutManager()">Log Out</button>
<button class="logout" onclick="loadRecords()">Refresh</button>

<table>
<thead><tr><th>Time</th><th>Staff</th><th>Type</th><th>Reason</th><th>Manager Note</th><th>Action</th></tr></thead>
<tbody id="recordsBody"></tbody>
</table>

<div class="pin-change">
<h3>Staff Settings</h3>
<div class="pin-grid">
<select id="pinStaff"></select>
<input type="text" id="newPin" maxlength="4" placeholder="New PIN">
<input type="date" id="birthdayInput">
<select id="showBirthdayInput">
<option value="true">Show Birthday</option>
<option value="false">Hide Birthday</option>
</select>
<button class="save-pin" onclick="saveStaffSettings()">Save</button>
</div>
</div>

</div>
</div>
</div>

</div>

<script>
const SUPABASE_URL="https://mpwnqvktljeqetfrlcgy.supabase.co";
const SUPABASE_KEY="sb_publishable_qhK08NotN0dxj13ymiOgWw_tEbopdwx";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const MANAGER_PIN="1234";

let staff=[],pinEntry="";

function tick(){
 const n=new Date();
 timeNow.innerText=n.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
 dateNow.innerText=n.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
setInterval(tick,1000);tick();

function setStatus(t){status.innerText=t}

async function loadStaff(){
 const {data,error}=await db.from("staff").select("*").order("name");
 if(error){setStatus(error.message);return}
 staff=data||[];

 staffSelect.innerHTML='<option value="">Select Staff</option>';
 pinStaff.innerHTML='<option value="">Select Staff</option>';

 staff.forEach(s=>{
  staffSelect.innerHTML+=`<option value="${s.id}">${s.name} • ${s.role} • ${s.branch}</option>`;
  pinStaff.innerHTML+=`<option value="${s.id}">${s.name}</option>`;
 });

 renderBirthdays();
 setStatus("Ready — select your name and enter your PIN");
}

function renderBirthdays(){
 const today=new Date();
 const tm=today.getMonth()+1, td=today.getDate();
 const tomorrow=new Date(today); tomorrow.setDate(today.getDate()+1);
 const mm=tomorrow.getMonth()+1, dd=tomorrow.getDate();

 const shown=staff.filter(s=>s.show_birthday!==false && s.birthday);
 const todayNames=shown.filter(s=>{const d=new Date(s.birthday);return d.getMonth()+1===tm && d.getDate()===td}).map(s=>s.name);
 const tomorrowNames=shown.filter(s=>{const d=new Date(s.birthday);return d.getMonth()+1===mm && d.getDate()===dd}).map(s=>s.name);

 if(todayNames.length) birthdayBox.innerText="🎉 Today: "+todayNames.join(", ")+"'s birthday!";
 else if(tomorrowNames.length) birthdayBox.innerText="🎂 Tomorrow: "+tomorrowNames.join(", ")+"'s birthday";
 else birthdayBox.innerText="🎂 No staff birthdays today or tomorrow";
}

function getStaff(){return staff.find(x=>String(x.id)===String(staffSelect.value))}
function validPin(){
 const s=getStaff(), pin=pinInput.value;
 if(!s){setStatus("Select your name");return null}
 if(pin!==s.pin){setStatus("Incorrect PIN");return null}
 return s;
}

async function lastRecord(staffId){
 const start=new Date(); start.setHours(0,0,0,0);
 const {data}=await db.from("attendance").select("*").eq("staff_id",staffId).gte("clock_time",start.toISOString()).order("clock_time",{ascending:false}).limit(1);
 return data?.[0]||null;
}

function clearAfterAction(){
 pinInput.value="";
 reasonInput.value="";
}

async function clockIn(){
 const s=validPin(); if(!s)return;
 const last=await lastRecord(s.id);
 if(last && last.type==="clock_in"){setStatus("You are already clocked in");clearAfterAction();return}

 const {error}=await db.from("attendance").insert({staff_id:s.id,type:"clock_in",reason:reasonInput.value||null,branch:s.branch});
 if(error){setStatus(error.message);return}
 setStatus(`Clocked in successfully — ${s.name}`);
 clearAfterAction();
}

async function clockOut(){
 const s=validPin(); if(!s)return;
 const last=await lastRecord(s.id);
 if(!last || last.type==="clock_out"){setStatus("You are not currently clocked in");clearAfterAction();return}

 const {error}=await db.from("attendance").insert({staff_id:s.id,type:"clock_out",reason:reasonInput.value||null,branch:s.branch});
 if(error){setStatus(error.message);return}
 setStatus(`Clocked out successfully — ${s.name}`);
 clearAfterAction();
}

function openManager(){managerArea.classList.remove("hidden")}
function logoutManager(){dashboard.classList.add("hidden");managerLogin.classList.remove("hidden");managerArea.classList.add("hidden");pinEntry="";refreshDots()}

function pressPin(v){
 if(v==="del")pinEntry=pinEntry.slice(0,-1);
 else if(v==="ok"){loginManager();return}
 else if(pinEntry.length<4)pinEntry+=v;
 refreshDots();
 if(pinEntry.length===4)loginManager();
}
function refreshDots(){for(let i=0;i<4;i++)document.getElementById("d"+i).classList.toggle("fill",i<pinEntry.length)}

function loginManager(){
 if(pinEntry!==MANAGER_PIN){pinEntry="";refreshDots();return}
 managerLogin.classList.add("hidden");
 dashboard.classList.remove("hidden");
 pinEntry="";refreshDots();
 loadRecords();
}

async function loadRecords(){
 const {data,error}=await db.from("attendance").select("*, staff(name)").order("clock_time",{ascending:false}).limit(150);
 if(error){alert(error.message);return}
 recordsBody.innerHTML="";
 data.forEach(r=>{
  recordsBody.innerHTML+=`
  <tr>
    <td>${new Date(r.clock_time).toLocaleString("en-GB")}</td>
    <td>${r.staff?.name||""}</td>
    <td>${r.type}</td>
    <td>${r.reason||""}</td>
    <td>${r.manager_note||""}</td>
    <td><button class="note-btn" onclick="addNote(${r.id})">Note/Edit</button></td>
  </tr>`;
 });
}

async function addNote(id){
 const note=prompt("Manager note / correction");
 if(note===null)return;
 const {error}=await db.from("attendance").update({manager_note:note,corrected:true}).eq("id",id);
 if(error){alert("Could not save note: "+error.message);return}
 await loadRecords();
}

pinStaff.addEventListener("change",()=>{
 const s=staff.find(x=>String(x.id)===String(pinStaff.value));
 if(!s)return;
 birthdayInput.value=s.birthday||"";
 showBirthdayInput.value=s.show_birthday===false?"false":"true";
});

async function saveStaffSettings(){
 const id=pinStaff.value;
 if(!id){alert("Select staff member");return}
 const updates={
  birthday:birthdayInput.value||null,
  show_birthday:showBirthdayInput.value==="true"
 };
 const pin=newPin.value.trim();
 if(pin){
  if(!/^[0-9]{4}$/.test(pin)){alert("PIN must be 4 digits");return}
  updates.pin=pin;
 }
 const {error}=await db.from("staff").update(updates).eq("id",id);
 if(error){alert(error.message);return}
 newPin.value="";
 alert("Staff settings saved");
 await loadStaff();
}

loadStaff();
</script>

</body>
</html>
