<!DOCTYPE html>
<html>
<head>
  <title>PharmacyX Staff Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0f172a;
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
      text-align:center;
    }

    .box{
      background:#1e293b;
      padding:40px;
      border-radius:16px;
      width:320px;
    }

    h1{
      margin-top:0;
      color:#4ade80;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:#22c55e;
      color:black;
      font-weight:bold;
      font-size:16px;
      cursor:pointer;
      margin-top:20px;
    }

    .status{
      margin-top:20px;
      color:#94a3b8;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>PharmacyX</h1>

  <p>Staff Hub Test Deployment</p>

  <button onclick="clockIn()">
    Clock In
  </button>

  <div class="status" id="status">
    Not clocked in
  </div>
</div>

<script>
  function clockIn(){
    document.getElementById('status').innerText =
      "Clocked in successfully";
  }
</script>

</body>
</html>
