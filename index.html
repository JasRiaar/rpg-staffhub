<!DOCTYPE html>
<html>
<head>
  <title>Riaar Pharmacy Group Staff Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{
      margin:0;
      padding:25px;
      background:#0f172a;
      color:white;
      font-family:Arial;
    }

    .box{
      max-width:420px;
      margin:auto;
      background:#1e293b;
      padding:28px;
      border-radius:18px;
    }

    h1{
      margin-top:0;
      color:#4ade80;
      font-size:28px;
    }

    .sub{
      color:#94a3b8;
      margin-bottom:25px;
    }

    label{
      display:block;
      margin-top:18px;
      margin-bottom:6px;
      font-size:14px;
      color:#cbd5e1;
    }

    select,input,button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      font-size:16px;
      box-sizing:border-box;
    }

    select,input{
      background:#334155;
      color:white;
    }

    button{
      background:#22c55e;
      color:black;
      font-weight:bold;
      cursor:pointer;
      margin-top:14px;
    }

    .out{
      background:#ef4444;
      color:white;
    }

    .status{
      margin-top:20px;
      color:#cbd5e1;
      background:#0f172a;
      padding:14px;
      border-radius:10px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Riaar Pharmacy Group</h1>

  <div class="sub">
    Staff Hub
  </div>

  <label>Staff Member</label>
  <select id="staffSelect"></select>

  <label>PIN</label>
  <input
    id="pinInput"
    type="password"
    placeholder="Enter PIN"
  >

  <label>Reason (optional)</label>
  <input
    id="reasonInput"
    placeholder="Late arrival / early leave reason"
  >

  <button onclick="clockIn()">
    Clock In
  </button>

  <button class="out" onclick="clockOut()">
    Clock Out
  </button>

  <div class="status" id="status">
    Loading staff...
  </div>

</div>

<script>

const SUPABASE_URL = "https://mpwnqvktljeqetfrlcgy.supabase.co";

const SUPABASE_KEY = "sb_publishable_qhK08NotN0dxj13ymiOgWw_tEbopdwx";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let staff = [];

async function loadStaff(){

  const { data, error } = await db
    .from("staff")
    .select("*")
    .eq("branch","Yew Tree")
    .order("name");

  if(error){
    document.getElementById("status").innerText =
      error.message;
    return;
  }

  staff = data;

  const select =
    document.getElementById("staffSelect");

  select.innerHTML = "";

  data.forEach(s => {

    const opt =
      document.createElement("option");

    opt.value = s.id;

    opt.textContent =
      s.name + " - " + s.role;

    select.appendChild(opt);

  });

  document.getElementById("status").innerText =
    "Ready";

}

function selectedStaff(){

  const id =
    document.getElementById("staffSelect").value;

  return staff.find(
    s => String(s.id) === String(id)
  );

}

function validatePin(){

  const s = selectedStaff();

  const pin =
    document.getElementById("pinInput").value;

  if(!s){
    alert("Select a staff member");
    return null;
  }

  if(pin !== s.pin){
    alert("Incorrect PIN");
    return null;
  }

  return s;

}

async function clockIn(){

  const s = validatePin();

  if(!s) return;

  const reason =
    document.getElementById("reasonInput").value;

  const { error } = await db
    .from("attendance")
    .insert({
      staff_id: s.id,
      type: "clock_in",
      reason: reason,
      branch: s.branch
    });

  if(error){
    alert(error.message);
    return;
  }

  document.getElementById("status").innerText =
    s.name + " clocked in successfully";

}

async function clockOut(){

  const s = validatePin();

  if(!s) return;

  const reason =
    document.getElementById("reasonInput").value;

  const { error } = await db
    .from("attendance")
    .insert({
      staff_id: s.id,
      type: "clock_out",
      reason: reason,
      branch: s.branch
    });

  if(error){
    alert(error.message);
    return;
  }

  document.getElementById("status").innerText =
    s.name + " clocked out successfully";

}

loadStaff();

</script>

</body>
</html>
