<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Riaar Pharmacy Group Staff Hub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#071225;
  --card:#0d1b33;
  --card2:#132442;
  --border:#243655;
  --text:#ffffff;
  --muted:#9ba9c4;
  --green:#22c55e;
  --red:#ef4444;
  --blue:#3b82f6;
}

body{
  font-family:'Outfit',sans-serif;
  background:linear-gradient(180deg,#071225 0%,#08101f 100%);
  color:var(--text);
  min-height:100vh;
  padding:24px;
}

.container{
  max-width:1200px;
  margin:auto;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
}

.logo{
  height:70px;
}

.manager-btn{
  background:#132442;
  border:1px solid #27426d;
  color:white;
  padding:12px 18px;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
}

.manager-btn:hover{
  background:#193157;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:28px;
  padding:36px;
}

.eye{
  color:#4ade80;
  font-size:14px;
  letter-spacing:2px;
  font-weight:700;
  margin-bottom:12px;
}

h1{
  font-size:64px;
  margin-bottom:30px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px;
}

.field{
  margin-bottom:22px;
}

.field label{
  display:block;
  margin-bottom:10px;
  font-size:14px;
  font-weight:700;
  color:#b6c2d9;
  letter-spacing:1px;
}

input,select,textarea{
  width:100%;
  padding:24px;
  border-radius:18px;
  border:1px solid #32486d;
  background:#15233f;
  color:white;
  font-size:22px;
  font-family:'Outfit',sans-serif;
}

textarea{
  resize:none;
  height:90px;
}

.btns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px;
  margin-top:24px;
}

.btn{
  border:none;
  border-radius:22px;
  padding:28px;
  font-size:34px;
  font-weight:800;
  cursor:pointer;
}

.green{
  background:linear-gradient(90deg,#22c55e,#16a34a);
  color:black;
}

.red{
  background:linear-gradient(90deg,#ef4444,#dc2626);
  color:white;
}

.status{
  margin-top:26px;
  background:#15233f;
  border:1px solid #32486d;
  border-radius:18px;
  padding:24px;
  font-size:20px;
  color:#d5dfef;
}

.hidden{
  display:none;
}

.manager-panel{
  margin-top:40px;
}

.small-title{
  font-size:32px;
  margin-bottom:20px;
}

.keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  max-width:320px;
  margin:auto;
}

.key{
  background:#1a2c4d;
  border:1px solid #38527e;
  border-radius:16px;
  padding:20px;
  text-align:center;
  font-size:28px;
  cursor:pointer;
}

.key:hover{
  background:#213965;
}

.dots{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-bottom:24px;
}

.dot{
  width:18px;
  height:18px;
  border-radius:50%;
  border:2px solid #38527e;
}

.dot.fill{
  background:#4ade80;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th,td{
  padding:14px;
  border-bottom:1px solid #243655;
  text-align:left;
}

th{
  color:#a8b6cf;
}

.note-btn{
  background:#2563eb;
  border:none;
  color:white;
  padding:8px 14px;
  border-radius:10px;
  cursor:pointer;
}

.logout{
  margin-top:20px;
  background:#1f2937;
  color:white;
  border:none;
  padding:12px 18px;
  border-radius:12px;
  cursor:pointer;
}

.pin-change{
  margin-top:40px;
  background:#12203a;
  border:1px solid #2d456a;
  border-radius:20px;
  padding:24px;
}

.pin-change h3{
  margin-bottom:16px;
}

.pin-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr auto;
  gap:12px;
}

.save-pin{
  background:#22c55e;
  border:none;
  color:black;
  font-weight:700;
  border-radius:14px;
  padding:0 24px;
  cursor:pointer;
}

@media(max-width:900px){

  h1{
    font-size:42px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .btns{
    grid-template-columns:1fr;
  }

  .btn{
    font-size:28px;
  }

}

</style>
</head>

<body>

<div class="container">

<div class="topbar">

<img src="logo.png" class="logo">

<button class="manager-btn" onclick="openManager()">
🔒 Manager
</button>

</div>

<div class="card">

<div class="eye">STAFF CLOCK-IN / CLOCK-OUT</div>

<h1>Who are you?</h1>

<div class="grid">

<div class="field">
<label>STAFF MEMBER</label>
<select id="staffSelect"></select>
</div>

<div class="field">
<label>PIN</label>
<input type="password" id="pinInput" placeholder="Enter your PIN">
</div>

</div>

<div class="field">
<label>REASON / NOTE OPTIONAL</label>
<textarea id="reasonInput" placeholder="Late arrival / early finish reason"></textarea>
</div>

<div class="btns">

<button class="btn green" onclick="clockIn()">
▶ Clock In
</button>

<button class="btn red" onclick="clockOut()">
■ Clock Out
</button>

</div>

<div class="status" id="status">
Ready — select your name and enter your PIN
</div>

</div>

<div id="managerArea" class="hidden manager-panel">

<div class="card">

<div id="managerLogin">

<div class="small-title">
Manager Access
</div>

<div class="dots">
<div class="dot" id="d0"></div>
<div class="dot" id="d1"></div>
<div class="dot" id="d2"></div>
<div class="dot" id="d3"></div>
</div>

<div class="keypad">

<div class="key" onclick="pressPin('1')">1</div>
<div class="key" onclick="pressPin('2')">2</div>
<div class="key" onclick="pressPin('3')">3</div>

<div class="key" onclick="pressPin('4')">4</div>
<div class="key" onclick="pressPin('5')">5</div>
<div class="key" onclick="pressPin('6')">6</div>

<div class="key" onclick="pressPin('7')">7</div>
<div class="key" onclick="pressPin('8')">8</div>
<div class="key" onclick="pressPin('9')">9</div>

<div class="key" onclick="pressPin('del')">⌫</div>
<div class="key" onclick="pressPin('0')">0</div>
<div class="key" onclick="pressPin('ok')">OK</div>

</div>

</div>

<div id="dashboard" class="hidden">

<div class="small-title">
Attendance Dashboard
</div>

<table>

<thead>
<tr>
<th>Time</th>
<th>Staff</th>
<th>Type</th>
<th>Reason</th>
<th>Manager Note</th>
<th>Action</th>
</tr>
</thead>

<tbody id="recordsBody"></tbody>

</table>

<div class="pin-change">

<h3>Change Staff PIN</h3>

<div class="pin-grid">

<select id="pinStaff"></select>

<input type="text" id="newPin" placeholder="New PIN">

<button class="save-pin" onclick="changePin()">
Save
</button>

</div>

</div>

<button class="logout" onclick="logoutManager()">
Log Out
</button>

</div>

</div>

</div>

</div>

<script>

const SUPABASE_URL = "https://mpwnqvktljeqetfrlcgy.supabase.co";
const SUPABASE_KEY = "sb_publishable_qhK08NotN0dxj13ymiOgWw_tEbopdwx";

const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const MANAGER_PIN = "1234";

let staff = [];
let pinEntry = "";

async function loadStaff(){

  const {data,error} = await db
  .from("staff")
  .select("*")
  .order("name");

  if(error){
    setStatus(error.message);
    return;
  }

  staff = data || [];

  const sel = document.getElementById("staffSelect");
  const pinSel = document.getElementById("pinStaff");

  sel.innerHTML = `<option value="">Select Staff</option>`;
  pinSel.innerHTML = ``;

  staff.forEach(s=>{

    sel.innerHTML += `
      <option value="${s.id}">
        ${s.name} • ${s.role} • ${s.branch}
      </option>
    `;

    pinSel.innerHTML += `
      <option value="${s.id}">
        ${s.name}
      </option>
    `;

  });

  setStatus("Ready — select your name and enter your PIN");

}

function setStatus(text){
  document.getElementById("status").innerText = text;
}

function getStaff(){

  const id = document.getElementById("staffSelect").value;
  return staff.find(x=>String(x.id)===String(id));

}

function validPin(){

  const s = getStaff();
  const pin = document.getElementById("pinInput").value;

  if(!s){
    setStatus("Select your name");
    return null;
  }

  if(pin !== s.pin){
    setStatus("Incorrect PIN");
    return null;
  }

  return s;

}

async function alreadyClocked(staffId){

  const today = new Date().toISOString().split("T")[0];

  const {data} = await db
  .from("attendance")
  .select("*")
  .eq("staff_id",staffId)
  .gte("clock_time",today)
  .order("clock_time",{ascending:false})
  .limit(1);

  return data?.[0] || null;

}

async function clockIn(){

  const s = validPin();
  if(!s) return;

  const last = await alreadyClocked(s.id);

  if(last && last.type === "clock_in"){
    setStatus("You are already clocked in");
    return;
  }

  const {error} = await db
  .from("attendance")
  .insert({
    staff_id:s.id,
    type:"clock_in",
    reason:document.getElementById("reasonInput").value,
    branch:s.branch
  });

  if(error){
    setStatus(error.message);
    return;
  }

  setStatus(`Clocked in successfully — ${s.name}`);

}

async function clockOut(){

  const s = validPin();
  if(!s) return;

  const last = await alreadyClocked(s.id);

  if(!last || last.type === "clock_out"){
    setStatus("You are not currently clocked in");
    return;
  }

  const {error} = await db
  .from("attendance")
  .insert({
    staff_id:s.id,
    type:"clock_out",
    reason:document.getElementById("reasonInput").value,
    branch:s.branch
  });

  if(error){
    setStatus(error.message);
    return;
  }

  setStatus(`Clocked out successfully — ${s.name}`);

}

function openManager(){
  document.getElementById("managerArea").classList.remove("hidden");
}

function logoutManager(){

  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("managerLogin").classList.remove("hidden");
  document.getElementById("managerArea").classList.add("hidden");

  pinEntry = "";
  refreshDots();

}

function pressPin(v){

  if(v==="del"){
    pinEntry = pinEntry.slice(0,-1);
  }
  else if(v==="ok"){
    loginManager();
    return;
  }
  else{
    if(pinEntry.length<4){
      pinEntry += v;
    }
  }

  refreshDots();

  if(pinEntry.length===4){
    loginManager();
  }

}

function refreshDots(){

  for(let i=0;i<4;i++){

    document
    .getElementById("d"+i)
    .classList.toggle("fill",i<pinEntry.length);

  }

}

async function loginManager(){

  if(pinEntry !== MANAGER_PIN){

    pinEntry = "";
    refreshDots();
    return;

  }

  document.getElementById("managerLogin").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");

  pinEntry = "";
  refreshDots();

  loadRecords();

}

async function loadRecords(){

  const {data,error} = await db
  .from("attendance")
  .select("*, staff(name)")
  .order("clock_time",{ascending:false})
  .limit(100);

  if(error) return;

  const body = document.getElementById("recordsBody");

  body.innerHTML = "";

  data.forEach(r=>{

    body.innerHTML += `

      <tr>

      <td>${new Date(r.clock_time).toLocaleString()}</td>

      <td>${r.staff?.name || ""}</td>

      <td>${r.type}</td>

      <td>${r.reason || ""}</td>

      <td>${r.manager_note || ""}</td>

      <td>
        <button class="note-btn" onclick="addNote(${r.id})">
          Note
        </button>
      </td>

      </tr>

    `;

  });

}

async function addNote(id){

  const note = prompt("Manager note");

  if(!note) return;

  await db
  .from("attendance")
  .update({
    manager_note:note,
    corrected:true
  })
  .eq("id",id);

  loadRecords();

}

async function changePin(){

  const id = document.getElementById("pinStaff").value;
  const pin = document.getElementById("newPin").value;

  if(!pin) return;

  await db
  .from("staff")
  .update({
    pin:pin
  })
  .eq("id",id);

  alert("PIN updated");

}

loadStaff();

</script>

</body>
</html>
